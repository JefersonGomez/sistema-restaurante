services:
  postgres:
    image: postgres:16-alpine
    container_name: menu-qr-postgres
    environment:
      POSTGRES_USER: menuqr
      POSTGRES_PASSWORD: menuqr
      POSTGRES_DB: menu_qr
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U menuqr -d menu_qr']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
