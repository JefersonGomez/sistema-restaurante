# KitchaGo en el nginx del VPS (/etc/nginx/sites-available/kitchago). Solo HTTP: certbot --nginx
# agrega el HTTPS y la redirección. No toca los sitios de otros proyectos.

# Landing
server {
    listen 80;
    listen [::]:80;
    server_name kitchago.com www.kitchago.com;
    root /opt/kitchago/www/landing;
    index index.html;
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}

# Menú de los clientes (QR)
server {
    listen 80;
    listen [::]:80;
    server_name menu.kitchago.com;
    root /opt/kitchago/www/menu;
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri /index.html;
    }
}

# Panel del personal
server {
    listen 80;
    listen [::]:80;
    server_name panel.kitchago.com;
    root /opt/kitchago/www/panel;
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # El service worker se revisa siempre (así llegan las actualizaciones).
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri /index.html;
    }
}

# API y tiempo real (Socket.IO)
server {
    listen 80;
    listen [::]:80;
    server_name api.kitchago.com;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
