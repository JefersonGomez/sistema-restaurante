# Producción en el VPS (/opt/kitchago). La web la sirve el nginx del servidor (compartido con
# otros proyectos); aquí solo corren la base de datos y la API, que escucha solo en el servidor.
name: kitchago
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file: /opt/kitchago/.env
    environment:
      UPLOADS_DIR: /data/uploads
    ports:
      - '127.0.0.1:4100:4000'
    volumes:
      - /opt/kitchago/uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
